<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!--Link al CSS de Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <title>Proyecto | Bootstrap_1</title>
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!--Barra de navegación + Header-->
        <nav class="navbar navbar-expand-lg bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img class="img-fluid" src="./assets/img/logo_def.png" alt="Logo Web" width="200">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <!--Con ms-auto mueve los items del navbar a la derecha con me-auto los moveria a la izquierda al lado del logo-->
                        <li class="nav-item">
                            <a class="btn btn-light active me-2" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light me-2" href="./views/productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="btn btn-outline-light" href="./views/contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!--Contenido-->
        <section class="flex-fill d-flex align-items-start justify-content-center pt-5">
            <!--Con flex-fill ocupa el espacio disponible y con d-flex activa el flexbox align-items-start alinea verticalmente el contenido al inicio-->
            <!--justify-content-center centra horizontalmente-->
            <!--Con p(t(top),b(bottom),s(start/left),e(end/right),blank(para los 4 lados))-(0-5) añadimos padding y con m(t(top),b(bottom),s(start/left),e(end/right),blank(para los 4 lados))-(0-5) añadimos margin-->
            <article class="container text-center">
                    <div class="row">
                        <div class="col-lg-12">
                            <h2>Creamos páginas web modernas y funcionales</h2>
                            <p>En PixelNova diseñamos sitios web atractivos, rápidos y adaptados a todos los dispositivos</p>
                        </div>
                        <div class="col-lg-12">
                            <div class="btn btn-primary">Solicita presupuesto</div>
                        </div>
                    </div>
            </article>
        </section>
        <!--Script enlace de Bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
